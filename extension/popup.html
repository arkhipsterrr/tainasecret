<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font-family: system-ui, sans-serif; width: 320px; padding: 10px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; font-size: 11px; color: #555; margin-top: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 5px; font-size: 12px; }
  button { margin-top: 8px; padding: 6px 10px; border: 0; border-radius: 5px; background: #d98324; color: #fff; cursor: pointer; font-size: 12px; }
  button.secondary { background: #666; }
  .row { display: flex; gap: 6px; }
  .row button { flex: 1; }
  pre { background: #f5f5f5; padding: 6px; border-radius: 5px; font-size: 11px; white-space: pre-wrap; max-height: 160px; overflow: auto; margin-top: 8px; }
  .status { font-size: 12px; font-weight: 600; margin: 4px 0 2px; }
</style>
</head>
<body>
  <h1>J-Sub Session Sync</h1>
  <div id="status" class="status">Site login: checking…</div>
  <label>Server URL</label>
  <input id="server" type="text" placeholder="http://217.144.190.165:8787" />
  <label>API token</label>
  <input id="token" type="password" placeholder="bearer token" />
  <button class="secondary" id="save">Save settings</button>
  <div class="row">
    <button id="sync">Sync session</button>
    <button class="secondary" id="check">Check server</button>
  </div>
  <button class="secondary" id="opensite">Open j-subculture login</button>
  <pre id="out">Log in on j-subculture.com, then click "Sync session".</pre>
  <script src="popup.js"></script>
</body>
</html>
